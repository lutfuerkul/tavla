name: Deploy Tavla to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        # Bu adım hiçbir iş yapmaz: paketi yükledikten sonra Pages'in dağıtımı
        # sıradan almasını bekler. Sıra normalde saniyeler sürüyor, ama uzadığı
        # günler oluyor — ve varsayılan sınır tam on dakika, yani beklemenin
        # uzadığı gün deploy hata veriyor. Yükleme çoktan bitmiş, kuyruk hâlâ
        # ilerliyor: bekleyip almak, çarpı görüp elle yeniden tetiklemekten
        # iyidir. Yarım saat, işin kendisi için değil, sıra için.
        with:
          timeout: 1800000
