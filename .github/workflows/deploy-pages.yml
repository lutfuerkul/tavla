name: Deploy Tavla to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Dağıtımlar sıraya girsin diye, birbirinin üstüne binmesinler. Adın kendisinin
# bir anlamı yok; önemli olan bütün dağıtımların aynı adı paylaşması.
#
# Ad bir kez değiştirildi ve sebebi şu: bir çalışma "waiting" durumunda takılı
# kaldı — runner hiç atanmadı, iptal isteği saatlerce 500 ve 502 döndü, GitHub
# sağlığına kavuştuktan sonra bile. Takılı çalışma grubu elinde tuttuğu için
# ondan sonraki her dağıtım arkasında "pending" olarak sıraya giriyor ve hiç
# başlamıyordu. Grubun adını değiştirmek, o kilidi devralmadan yeni bir sıra
# açar. Takılı olan bir gün çözülürse kendi başına koşar; yayınlayacağı şey de
# zaten ana dalın aynı hâlidir.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Bu adım paketi yükledikten sonra iş yapmaz: Pages'in dağıtımı sıraya
      # alıp bitirmesini bekler. Sıra normalde saniyeler sürüyor, ama uzadığı
      # günler oluyor ve adım tam on dakikada vazgeçiyor. O sınır yükseltilemez:
      # aksiyonun içinde on dakika bir tavandır ve verilen değer ona kırpılır —
      # yarım saat yazmak da on dakika demektir.
      #
      # Yapılabilecek olan, vazgeçtiğinde bir daha denemek. Vazgeçen adım kendi
      # dağıtımını iptal ediyor, ikinci deneme temiz bir tane açıyor; sıranın
      # uzun sürdüğü üç seferin ikisinde ikinci deneme saniyeler içinde bitti.
      # Elle yeniden tetiklemenin yaptığı işi iş akışının kendisi yapsın.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy (ikinci deneme)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
