name: Deploy Tavla functions

# Sunucu tarafı, elle deploy edilmesin diye. Yalnızca sunucuya ait dosyalar
# değiştiğinde çalışır — her main yazısında fonksiyonları yeniden yüklemenin
# anlamı yok. Elle çalıştırmak için Actions sekmesinden "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase/database.rules.json"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "functions"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # functions/package.json ne diyorsa o: sunucu Node 22'de koşuyor.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bağımlılıklar
        working-directory: functions
        run: npm ci || npm install

      # Kurallar iki yerde yazılı — tarayıcıda ve sunucuda. Aynı şeyi
      # söylediklerini deploy'dan önce burada da doğruluyoruz; firebase.json
      # zaten predeploy olarak çağırıyor, bu erken uyarı.
      - name: Kural eşitliği
        run: node functions/kural-esitligi.mjs

      # firebase-tools doğrudan çağrılıyor. Hazır bir action'ın arkasına
      # geçmek, sırrı hangi adla beklediğini bilmeyi gerektiriyor — ve yanlış
      # ad, kimlik hiç ulaşmamış gibi görünüyor ("have you run firebase
      # login?"). Anahtar burada bir dosyaya yazılıyor, Google kütüphaneleri
      # onu GOOGLE_APPLICATION_CREDENTIALS'tan kendi buluyor. Dosya
      # RUNNER_TEMP'te, iş bitince silinen yerde — depoya düşmüyor.
      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT sırrı yok — repo Settings → Secrets → Actions"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcloud.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcloud.json"
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules,database \
            --project tavla3b --non-interactive --force
