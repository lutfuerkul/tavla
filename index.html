<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tavla — 3B Masa</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <section id="intro" aria-label="Oyun başlangıcı">
        <nav id="langs" aria-label="Dil"></nav>
        <p class="eyebrow" data-i18n="eyebrow">3B TAVLA</p>
        <h1 data-i18n="door.title">Ayarlar</h1>
        <div id="modes">
          <button class="mode-pick" data-mode="solo" data-i18n="mode.solo">Bilgisayara karşı</button>
          <button class="mode-pick" data-mode="hotseat" data-i18n="mode.hotseat">İki kişi · aynı cihaz</button>
          <button class="mode-pick" data-mode="online" data-i18n="mode.online">Çevrimiçi</button>
        </div>
        <div id="lobby" hidden>
          <div class="lobby-row">
            <button id="host" data-i18n="lobby.host">Oda kur</button>
            <span class="lobby-or" data-i18n="lobby.or">ya da</span>
            <input id="code" inputmode="latin" autocapitalize="characters"
                   autocomplete="off" spellcheck="false" maxlength="5" placeholder="ABC12" />
            <button id="join" data-i18n="lobby.join">Katıl</button>
          </div>
          <p id="lobby-said"></p>
        </div>
        <div id="settings"></div>
        <button id="start" data-i18n="start" disabled>Oyuna başla</button>
        <p id="online" hidden></p>
      </section>
      <aside id="hud" aria-live="polite">
        <div><span data-i18n="hud.turn">SIRA</span><strong>KEMİK</strong></div>
        <div><span data-i18n="hud.dice">ZARLAR</span><strong>4 · 2</strong></div>
        <div><span data-i18n="hud.score">SKOR</span><strong>0 · 0</strong></div>
        <button id="view">Tepe kamerası</button>
      </aside>
      <button id="menu" data-i18n="menu">Menü</button>
      <div id="confirm" hidden>
        <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
          <p id="confirm-title" data-i18n="confirm.title">Oyundan çıkmak istediğine emin misin?</p>
          <p class="confirm-note" data-i18n="confirm.note">Sürmekte olan oyun kaybolur.</p>
          <div class="confirm-actions">
            <button id="confirm-no" data-i18n="confirm.no">Vazgeç</button>
            <button id="confirm-yes" data-i18n="confirm.yes">Çık</button>
          </div>
        </div>
      </div>
      <div id="result" hidden>
        <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="result-title">
          <p id="result-title">Kazandın</p>
          <p class="confirm-note" id="result-score">Skor 1 · 0</p>
          <div class="confirm-actions">
            <button id="result-quit" data-i18n="result.quit">Çık</button>
            <button id="result-next" data-i18n="result.next">Oyuna devam et</button>
          </div>
        </div>
      </div>
      <div id="notice" role="status"></div>
      <div id="controls">
        <button id="undo" data-i18n="undo" disabled>Geri al</button>
        <button id="done" data-i18n="done" disabled>Tamam</button>
      </div>
      <div id="crosshair" aria-hidden="true"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
