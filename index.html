<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tavla — 3B Masa</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <section id="intro" aria-label="Oyun başlangıcı">
        <p class="eyebrow">3B TAVLA</p>
        <h1>Masa ve taş seçimi</h1>
        <div id="modes">
          <button class="mode-pick" data-mode="solo">Bilgisayara karşı</button>
          <button class="mode-pick" data-mode="hotseat">İki kişi · aynı cihaz</button>
        </div>
        <div id="boards">
          <button class="board-pick" data-board="eski">
            <span class="board-name">Ahşap kaplama</span>
          </button>
          <button class="board-pick" data-board="klasik">
            <span class="board-name">Klasik masa</span>
          </button>
          <button class="board-pick" data-board="star">
            <span class="board-name">Ceviz kaplama masa</span>
          </button>
        </div>
        <div id="colours">
          <button class="colour-pick" data-colour="black">
            <span class="chip chip-black" aria-hidden="true"></span>Siyah
          </button>
          <button class="colour-pick" data-colour="ivory">
            <span class="chip chip-ivory" aria-hidden="true"></span>Kemik
          </button>
        </div>
        <button id="start" disabled>Oyuna başla</button>
      </section>
      <aside id="hud" aria-live="polite">
        <div><span>SIRA</span><strong>KEMİK</strong></div>
        <div><span>ZARLAR</span><strong>4 · 2</strong></div>
      </aside>
      <div id="notice" role="status"></div>
      <div id="controls">
        <button id="undo" disabled>Geri al</button>
        <button id="done" disabled>Tamam</button>
      </div>
      <div id="crosshair" aria-hidden="true"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
